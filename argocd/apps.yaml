---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MdHakkim/spring-boot-microservices.git
    targetRevision: main
    path: helm/microservice
    helm:
      releaseName: order-service
      valueFiles:
        - ../values/order-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mc-microservices
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
