replicaCount: 1
image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecret: acr-secret
containerPort: 8080
service:
  type: ClusterIP
  port: 8080
  nodePort: null
env:
  SPRING_PROFILES_ACTIVE: docker
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi
