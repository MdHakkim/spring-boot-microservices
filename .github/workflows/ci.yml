name: build-and-update

on:
  push:
    branches: [main]
    paths-ignore:
      - 'helm/values/**'
      - 'argocd/**'
      - 'deploy/**'

permissions:
  contents: write
concurrency:
  group: build-and-update
  cancel-in-progress: false
  
env:
  ACR: acrsave8kubernetes.azurecr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: [discovery-server, api-gateway, product-service, order-service, inventory-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ACR }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ACR }}/${{ matrix.service }}:latest

      update-tags:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
  
        - name: Update image tags for ArgoCD
          run: |
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git pull --rebase origin main
            for f in helm/values/*.yaml; do
              yq -i ".image.tag = \"${GITHUB_SHA}\"" "$f"
            done
            git commit -am "Deploy ${GITHUB_SHA::7}" || { echo "No changes"; exit 0; }
            for i in 1 2 3; do
              git push origin main && break
              git pull --rebase origin main
            done
